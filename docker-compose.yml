version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: node_course_postgres_container
    environment:
      POSTGRES_USER: nodejs_course_admin
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: nodejs_course_database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodejs_course_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: node_course_pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
